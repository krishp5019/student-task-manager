{% extends "base.html" %}

{% block title %}
Edit Task
{% endblock %}

{% block content %}

<main class="page-container edit-page">

    <section class="form-card">

        <div class="card-heading">

            <span class="eyebrow">Task management</span>

            <h1>Edit Task</h1>

            <p>
                Update the task details and save your changes.
            </p>

        </div>


        <form
            class="edit-form"
            action="/edit/{{ task['id'] }}"
            method="POST"
        >

            <label for="task">Task</label>

            <input
                type="text"
                id="task"
                name="task"
                value="{{ task['task'] }}"
            >


            <label for="priority">Priority</label>

            <select id="priority" name="priority">

                <option
                    {% if task['priority'] == 'High' %}selected{% endif %}
                >
                    High
                </option>

                <option
                    {% if task['priority'] == 'Medium' %}selected{% endif %}
                >
                    Medium
                </option>

                <option
                    {% if task['priority'] == 'Low' %}selected{% endif %}
                >
                    Low
                </option>

            </select>


            <button type="submit">
                Save Changes
            </button>

        </form>

    </section>

</main>

{% endblock %}
